# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Gegenereignis
description: "Die Gegenwahrscheinlichkeit 1 − P(E) berechnen, auch für „mindestens einmal“."
competencies: [zufall-gegenereignis]
blocks:
  - type: section
    id: warum
    title: Warum?
    blocks:
      - type: text
        text: >-
          Manche Ereignisse haben sehr viele günstige Ergebnisse – „mindestens einmal eine 6 bei drei Würfen“ zum Beispiel. Die alle zu zählen dauert ewig. Das Gegenteil ist im Baum oft nur ein einziger Pfad. Wer den Umweg über das Gegenereignis kennt, spart Zeit und Fehler.
  - type: section
    id: regel
    title: Regel
    blocks:
      - type: definition
        term: Gegenereignis
        explanation: >-
          Das Gegenereignis „nicht E“ enthält alle Ergebnisse, die *nicht* zu E gehören. E und „nicht E“ zusammen decken alles ab.
      - type: text
        text: "Die Wahrscheinlichkeiten von E und „nicht E“ ergeben zusammen 1:"
      - type: formula
        formula: 'P(\text{nicht } E) = 1 - P(E)'
      - type: text
        text: >-
          Der wichtigste Trick: **„mindestens einmal“** rechnet man über das Gegenereignis **„kein einziges Mal“**.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: Keine 6 würfeln
        blocks:
          - type: text
            text: |-
              Du würfelst einmal. Wie groß ist die Wahrscheinlichkeit, *keine* 6 zu würfeln?

              1. $P(6) = \frac{1}{6}$.
              2. $P(\text{keine } 6) = 1 - \frac{1}{6} = \frac{5}{6}$.
      - type: example
        title: Der Trick mit „mindestens einmal“
        blocks:
          - type: text
            text: |-
              Du würfelst dreimal. Wie groß ist $P(\text{mindestens eine } 6)$?

              1. Gegenereignis: *kein einziges Mal* eine 6. Das ist ein einziger Pfad: keine 6, keine 6, keine 6.
              2. Nach der [1. Pfadregel](/zufall/pfadregel-1/) multiplizierst du entlang des Pfades:
                 $\frac{5}{6} \cdot \frac{5}{6} \cdot \frac{5}{6}$ $= (\frac{5}{6})^3$ $= \frac{125}{216}$.
              3. $P(\text{mindestens eine } 6)$ $= 1 - \frac{125}{216}$ $= \frac{91}{216} \approx 42\,\%$.

              Ohne den Trick müsstest du 7 Pfade addieren. Mit dem Trick ist es eine Rechnung.
  - type: section
    id: bild
    title: Bild
    blocks:
      - type: figure
        image: images/zufall-gegenereignis.svg
        alt: Baumdiagramm zum dreimaligen Würfeln; orange ist der einzige Pfad von „kein einziges Mal 6“
        caption: >-
          Der Baum zum dreimaligen Würfeln. Auf jeder Stufe gibt es zwei Zweige: 6 mit $\frac{1}{6}$ und „keine 6“ (K) mit $\frac{5}{6}$.
          Orange ist der einzige Pfad des Gegenereignisses „kein einziges Mal 6“: keine 6, keine 6, keine 6, also
          $\frac{5}{6} \cdot \frac{5}{6} \cdot \frac{5}{6} = \frac{125}{216}$. Unter den acht Enden stehen die Pfadwahrscheinlichkeiten: $\frac{1}{216}$, $\frac{5}{216}$, $\frac{5}{216}$,
          $\frac{25}{216}$, $\frac{5}{216}$, $\frac{25}{216}$, $\frac{25}{216}$ und $\frac{125}{216}$.
        source: Eigene Darstellung der Mathe-Karte
        licence: MIT
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: gegen-erkennen
        text: Du würfelst dreimal. Was ist das Gegenereignis von „mindestens eine 6“?
        options:
          - text: keine 6 in allen drei Würfen
            correct: true
            info: „Mindestens eine 6“ heißt eine, zwei oder drei Sechsen. Alles andere ist das Gegenereignis, also keine einzige 6.
          - text: genau eine 6
            correct: false
            info: Das ist nur ein Teil von „mindestens eine 6“. Auch zwei oder drei Sechsen gehören dazu, dann ist die Bedingung ebenfalls erfüllt.
          - text: höchstens eine 6
            correct: false
            info: Dazu gehört auch „genau eine 6“, und die zählt schon zu „mindestens eine 6“. Ein Gegenereignis darf sich nicht mit dem Ereignis überschneiden.
          - text: dreimal eine 6
            correct: false
            info: Das ist nur ein Fall von „mindestens eine 6“, nämlich der mit den meisten Sechsen.
        hint: Das Gegenereignis enthält alle Ergebnisse, die nicht zum Ereignis gehören. Welche Ergebnisse sind das?
        explanation: Ereignis und Gegenereignis zusammen decken alle Ergebnisse ab, ohne sich zu überschneiden. Für „mindestens eine 6“ bleibt nur der eine Fall übrig, dass keine einzige 6 fällt.
      - type: vue-component
        id: gegenwahrscheinlichkeit
        component: ZufallGegen
        examples:
          accepted:
            - { answer: "91/216", seed: 1 }
            - { answer: "1-(5/6)^3", seed: 1 }
            - { answer: "0,42", seed: 1 }
          rejected:
            - { answer: "0" }
            - { answer: "125/216", seed: 1 }
            - { answer: "" }
      - type: generated
        id: gegenereignis-direkt
        given:
          p: { decimal: [0.05, 0.95], step: 0.05 }
        where:
          - "p != 0.5"
        task:
          text: >-
            Die Wahrscheinlichkeit, dass es morgen regnet, ist {{p}}. Wie groß ist die Wahrscheinlichkeit, dass es morgen *nicht* regnet?
        answer: { value: "1 - p", compare: { number: { decimals: 2 } } }
        mistakes:
          - value: "p"
            message: "Das ist P(Regen). Gefragt ist das Gegenereignis: 1 − P(Regen)."
        hint: "Regen und kein Regen ergeben zusammen 1."
        steps:
          - '$P(\text{kein Regen}) = 1 - P(\text{Regen}) = 1 - {{p}} = {{answer}}$'
      - type: number
        id: gegen-gluecksrad
        text: Bei einem Glücksrad gewinnst du mit der Wahrscheinlichkeit 0,2. Du drehst zweimal. Wie groß ist die Wahrscheinlichkeit, dass du mindestens einmal gewinnst? Gib sie in Prozent an.
        answer: 36
        tolerance: 0
        unit: "%"
        mistakes:
          - answer: 40
            message: Du hast die beiden Gewinnwahrscheinlichkeiten addiert. Bei „mindestens einmal“ ist das Gegenereignis der bessere Weg.
          - answer: 64
            message: Das ist die Wahrscheinlichkeit, dass du gar nicht gewinnst. Gefragt ist das Gegenteil davon.
        hint: Rechne erst die Wahrscheinlichkeit für „beide Male kein Gewinn“ aus. Wie groß ist sie bei einer Drehung?
        explanation: "Kein Gewinn hat bei einer Drehung die Wahrscheinlichkeit $1 - 0{,}2 = 0{,}8$. Beide Male kein Gewinn: $0{,}8 \\cdot 0{,}8 = 0{,}64$. Mindestens einmal gewinnen ist das Gegenereignis: $1 - 0{,}64 = 0{,}36 = 36\\,\\%$."
        examples:
          accepted: ["36", "36,0"]
          rejected: ["0,36", "4"]
