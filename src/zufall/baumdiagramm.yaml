# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Baumdiagramm
description: Ein Baumdiagramm zu einem mehrstufigen Zufallsversuch zeichnen, mit den Wahrscheinlichkeiten an den Zweigen, mit und ohne Zurücklegen.
competencies: [zufall-baumdiagramm]
blocks:
  - type: section
    id: warum
    title: Warum?
    blocks:
      - type: text
        text: >-
          Sobald du zweimal ziehst, wirfst oder würfelst, wird es unübersichtlich: Was kann beim ersten Mal passieren, was danach? Das Baumdiagramm ordnet alle Möglichkeiten Stufe für Stufe. Mit einem sauberen Baum lösen sich die Pfadregeln fast von allein – ohne Baum verliert man schnell einen Fall.
  - type: section
    id: regel
    title: Regel
    blocks:
      - type: definition
        term: mehrstufiger Zufallsversuch
        explanation: >-
          Ein Zufallsversuch aus mehreren Zügen (Stufen), zum Beispiel zweimal aus einer Urne ziehen oder dreimal eine Münze werfen.
      - type: text
        text: |-
          Für jede Stufe zeichnest du **Zweige** zu allen möglichen Ergebnissen.

          - An jeden Zweig schreibst du seine **Wahrscheinlichkeit** (Laplace: günstig durch möglich).
          - Die Zweige an einem Knoten ergeben zusammen immer **1**.
          - Reihenfolge beim Zeichnen: erst alle Zweige, dann die Kugeln, dann die Brüche.
          - **Ohne Zurücklegen** ändern sich ab der zweiten Stufe Zähler und Nenner (mehr dazu unter
            [Ohne Zurücklegen](/zufall/ohne-zuruecklegen/)).
      - type: formula
        formula: 'P(\text{Zweig 1}) + P(\text{Zweig 2}) + \text{…} = 1'
      - type: definition
        term: Pfad
        explanation: Ein Weg im Baumdiagramm vom Start bis zu einem Ende.
      - type: definition
        term: Zweig
        explanation: Eine Linie im Baumdiagramm. An jedem Zweig steht, wie wahrscheinlich dieser Schritt ist.
      - type: definition
        term: Knoten
        explanation: Ein Punkt im Baumdiagramm, an dem sich der Baum verzweigt oder ein Pfad endet.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: Zweimal ziehen ohne Zurücklegen
        blocks:
          - type: text
            text: >-
              In einer Urne liegen 3 rote und 2 blaue Kugeln. Du ziehst zweimal **ohne Zurücklegen**. Das Bild unten zeigt den fertigen Baum.
          - type: table
            caption: Die Zweige des Baums, Stufe für Stufe
            header: [Stufe, Zweige]
            rowHeaders: true
            rows:
              - ["1. Stufe", '5 Kugeln: $P(\text{rot}) = \frac{3}{5}$ und $P(\text{blau}) = \frac{2}{5}$. Zusammen 1.']
              - [
                  "2. Stufe nach rot",
                  'Nur noch 4 Kugeln, 2 rote und 2 blaue: $P(\text{rot}) = \frac{2}{4}$ und $P(\text{blau}) = \frac{2}{4}$.',
                ]
              - [
                  "2. Stufe nach blau",
                  '4 Kugeln, 3 rote und 1 blaue: $P(\text{rot}) = \frac{3}{4}$ und $P(\text{blau}) = \frac{1}{4}$.',
                ]
          - type: text
            text: >-
              Unter den Enden stehen die Pfadwahrscheinlichkeiten (siehe [1. Pfadregel](/zufall/pfadregel-1/)). Ihre Summe ist 1 – ein guter Test für jeden Baum.
  - type: section
    id: bild
    title: Bild
    blocks:
      - type: figure
        image: images/zufall-baumdiagramm.svg
        alt: Baumdiagramm zur Urne mit 3 roten und 2 blauen Kugeln, zweimal ohne Zurücklegen
        caption: >-
          Ein Baumdiagramm zur Urne mit 3 roten (R) und 2 blauen (B) Kugeln, zweimal ohne Zurücklegen. Vom Start
          gehen zwei Zweige aus: rot mit $\frac{3}{5}$ und blau mit $\frac{2}{5}$. Nach rot folgen rot mit $\frac{2}{4}$ und blau mit $\frac{2}{4}$,
          nach blau folgen rot mit $\frac{3}{4}$ und blau mit $\frac{1}{4}$. Unter den vier Enden stehen die Pfadwahrscheinlichkeiten:
          rot-rot $\frac{3}{10}$, rot-blau $\frac{3}{10}$, blau-rot $\frac{3}{10}$, blau-blau $\frac{1}{10}$. Zusammen ergeben sie 1.
        source: Eigene Darstellung der Mathe-Karte
        licence: MIT
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: number
        id: baum-pfade-zaehlen
        text: Du wirfst eine Münze dreimal hintereinander und zeichnest dazu ein Baumdiagramm. Wie viele Pfade hat es, vom Start bis zu den Enden gezählt?
        answer: 8
        tolerance: 0
        mistakes:
          - answer: 6
            message: Bei jeder Stufe verdoppelt sich die Zahl der Pfade. Du hast zu wenige gezählt.
          - answer: 3
            message: Das ist die Zahl der Stufen, nicht die Zahl der Pfade. Jeder Pfad geht durch alle drei Stufen.
        hint: Zeichne den Baum. Nach dem ersten Wurf gibt es 2 Zweige, jeder teilt sich beim nächsten Wurf wieder in 2.
        explanation: Jede Stufe verdoppelt die Pfade, denn an jedes Ende kommen zwei neue Zweige. Nach drei Würfen sind es 2 · 2 · 2 = 8 Pfade.
        examples:
          accepted: ["8", "8,0"]
          rejected: ["6", "16"]
      - type: matching
        id: baum-begriffe
        text: Ordne jedem Begriff aus dem Baumdiagramm seine Bedeutung zu.
        pairs:
          - left: Stufe
            right: ein Zug des Versuchs, zum Beispiel der erste Wurf
          - left: Zweig
            right: eine Linie zu einem möglichen Ergebnis, mit seiner Wahrscheinlichkeit
          - left: Pfad
            right: ein Weg vom Start bis zu einem Ende des Baums
          - left: Zweige an einem Knoten
            right: ihre Wahrscheinlichkeiten ergeben zusammen immer 1
        distractors:
          - die Zahl der Kugeln in der Urne
        hint: Lies noch einmal die Regel und die Begriffe Pfad und Zweig.
        explanation: Ein Baum hat Stufen, Zweige und Pfade. An jedem Zweig steht eine Wahrscheinlichkeit, entlang eines Pfades verläuft die Rechnung, und die Zweige eines Knotens decken alle Möglichkeiten dieser Stufe ab.
      - type: vue-component
        id: baum-ergaenzen
        component: ZufallBaumLuecken
        examples:
          accepted:
            - { answer: { a: "1/2", b: "1/2", c: "1/2" }, seed: 1 }
            - { answer: { a: "0,5", b: "50 %", c: "2/4" }, seed: 1 }
          rejected:
            - { answer: { a: "1/2", b: "1/2", c: "1/3" }, seed: 1 }
            - { answer: {} }
      - type: generated
        id: baumdiagramm-nenner
        given:
          r: { int: [2, 6] }
          b: { int: [2, 5] }
        task:
          text: >-
            In einer Urne liegen {{r}} rote und {{b}} blaue Kugeln. Du ziehst zweimal ohne Zurücklegen. Welcher Nenner steht an den Zweigen der zweiten Stufe?
        answer: { value: "r + b - 1", compare: { number: { format: integer } } }
        mistakes:
          - value: "r + b"
            message: "Das ist der Nenner der ersten Stufe. Ohne Zurücklegen fehlt beim zweiten Zug eine Kugel."
          - value: "r + b - 2"
            message: "Es fehlt nur die eine Kugel, die du beim ersten Zug gezogen hast: Der Nenner wird um 1 kleiner."
        hint: "Wie viele Kugeln liegen noch in der Urne, nachdem du eine gezogen hast?"
        steps:
          - "Am Anfang liegen {{r}} + {{b}} Kugeln in der Urne."
          - "Nach dem ersten Zug fehlt eine Kugel: Der Nenner der zweiten Stufe ist {{answer}}."
