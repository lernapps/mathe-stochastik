# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: "Wiederholung für Kapitel 2 und 3: Zählprinzip, Brüche multiplizieren und Prozent, mit Beispielen und zwei Übungen."
recap: [mathematik/zaehlprinzip, mathematik/brueche-multiplizieren-dividieren, mathematik/prozent-grundbegriffe]
blocks:
  - type: section
    id: kopf
    title: Das brauchst du für diese Kapitel
    blocks:
      - type: text
        text: |
          Jetzt rechnest du mit Wahrscheinlichkeiten und zeichnest Bäume. Dafür musst du drei Dinge sicher können. Zu jedem
          gibt es eine kurze Wiederholung. Zwei Übungen zeigen dir, ob du es kannst. Die Karte nennt sie
          [Zählprinzip](https://lernapps.net/apps/map/mathematik/c/zaehlprinzip/),
          [Bruchrechnung: Multiplikation und Division](https://lernapps.net/apps/map/mathematik/c/brueche-multiplizieren-dividieren/)
          und [Prozentrechnung: Grundbegriffe](https://lernapps.net/apps/map/mathematik/c/prozent-grundbegriffe/).
  - type: section
    id: zaehlprinzip
    title: Zählprinzip
    blocks:
      - type: text
        text: "Damit zählst du später die Pfade in einem Baum. Ich kann mit dem Zählprinzip und Baumdiagrammen die Anzahl von Möglichkeiten bestimmen."
      - type: definition
        term: Zählprinzip
        explanation: Wenn du in mehreren Schritten wählst, multiplizierst du die Zahl der Möglichkeiten je Schritt. Bei 3 Eissorten und 2 Soßen gibt es 3 · 2 = 6 Kombinationen.
      - type: definition
        term: Baumdiagramm
        explanation: Ein Bild, das mit einem Punkt beginnt und sich bei jedem Schritt in Zweige teilt. Jeder Weg von oben nach unten ist eine Möglichkeit. Bei Eis und Soße hat der Baum 3 Zweige und an jedem 2 weitere, also 6 Wege.
      - type: single-choice
        id: menue-zaehlen
        text: In einem Café gibt es ein Menü aus 4 Vorspeisen, 5 Hauptgerichten und 3 Nachtischen. Wie viele verschiedene Menüs kann man zusammenstellen?
        options:
          - text: "12"
            correct: false
            info: Du hast die Zahlen addiert. Bei mehreren Schritten multiplizierst du die Möglichkeiten.
          - text: "60"
            correct: true
            info: 4 · 5 · 3 = 60. Jede Vorspeise passt zu jedem Hauptgericht und jedem Nachtisch.
          - text: "20"
            correct: false
            info: Das sind nur Vorspeise und Hauptgericht (4 · 5). Der Nachtisch fehlt noch.
        explanation: Beim Zählprinzip multiplizierst du die Möglichkeiten je Schritt.
  - type: section
    id: brueche-multiplizieren
    title: "Bruchrechnung: Multiplikation und Division"
    blocks:
      - type: text
        text: "Damit rechnest du später die Wahrscheinlichkeit entlang eines Pfades aus. Ich kann Brüche multiplizieren und dividieren."
      - type: definition
        term: Brüche multiplizieren
        explanation: Du multiplizierst Zähler mit Zähler und Nenner mit Nenner und kürzt, wenn es geht.
      - type: example
        title: Beispiel
        blocks:
          - type: formula
            formula: '\frac{2}{3} \cdot \frac{3}{4} = \frac{2 \cdot 3}{3 \cdot 4} = \frac{6}{12} = \frac{1}{2}'
          - type: text
            text: "Durch einen Bruch teilst du, indem du mit seinem Kehrwert multiplizierst. Der Kehrwert von drei Vierteln ist vier Drittel."
          - type: formula
            formula: '\frac{1}{2} : \frac{3}{4} = \frac{1}{2} \cdot \frac{4}{3} = \frac{4}{6} = \frac{2}{3}'
      - type: number
        id: bruch-prozent
        text: "Rechne $\\frac{3}{4} \\cdot \\frac{2}{5}$ aus und gib das Ergebnis in Prozent an."
        answer: 30
        tolerance: 0
        unit: "%"
        mistakes:
          - { answer: 0.3, message: "Das ist die Dezimalzahl. Für Prozent musst du sie mit 100 malnehmen." }
          - {
              answer: 115,
              message: "Du hast die Brüche addiert. Beim Multiplizieren multiplizierst du Zähler mit Zähler und Nenner mit Nenner.",
            }
        hint: "Multipliziere zuerst die Zähler und die Nenner. Kürze, dann wandle in Prozent um."
        explanation: "3 · 2 = 6 und 4 · 5 = 20, also sechs Zwanzigstel. Das sind 0,3, also 30 %."
  - type: section
    id: prozent
    title: "Prozentrechnung: Grundbegriffe"
    blocks:
      - type: text
        text: "Damit gibst du Wahrscheinlichkeiten später auch in Prozent an. Ich kann Prozent als Hundertstel deuten und in einer Aufgabe Grundwert, Prozentwert und Prozentsatz erkennen."
      - type: definition
        term: Prozent
        explanation: Prozent heißt Hundertstel. 15 % sind 15 von 100, also $\frac{15}{100} = 0{,}15$.
      - type: definition
        term: Grundwert
        explanation: Das Ganze, von dem ein Anteil genommen wird, zum Beispiel der volle Preis von 80 €.
      - type: definition
        term: Prozentsatz
        explanation: Der Anteil in Prozent, zum Beispiel 15 % Rabatt.
      - type: definition
        term: Prozentwert
        explanation: Der Teil des Ganzen, den der Prozentsatz angibt. 15 % von 80 € sind 12 €.
  - type: section
    id: checkliste
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          - die Zahl der Möglichkeiten bei mehreren Schritten mit dem Zählprinzip und einem Baumdiagramm bestimmst,
          - Brüche multiplizierst und das Ergebnis kürzt,
          - Prozent als Hundertstel deutest und Grundwert, Prozentsatz und Prozentwert unterscheidest.
      - type: text
        text: "Wenn eine Übung nicht klappte, übe den Baustein auf der Karte: [Zählprinzip](https://lernapps.net/apps/map/mathematik/c/zaehlprinzip/), [Bruchrechnung: Multiplikation und Division](https://lernapps.net/apps/map/mathematik/c/brueche-multiplizieren-dividieren/), [Prozentrechnung: Grundbegriffe](https://lernapps.net/apps/map/mathematik/c/prozent-grundbegriffe/)"
