# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Bedingte Wahrscheinlichkeit
description: "Bedingte Wahrscheinlichkeiten am Baumdiagramm oder in der Vierfeldertafel erkennen und berechnen."
competencies: [bedingte-wahrscheinlichkeit]
blocks:
  - type: section
    id: warum
    title: Was du hier lernst
    blocks:
      - type: text
        text: |
          Du lernst, eine Wahrscheinlichkeit unter einer **Bedingung** zu berechnen. Das Beispiel ist ein Schnelltest. Von
          1000 Personen sind 40 krank. Der Test zeigt bei 36 Kranken ein positives Ergebnis und bei 48 Gesunden auch, obwohl
          sie gesund sind. Tippe in der Tafel auf die Zelle „krank, Test positiv“. Lies dann im Baum ab, welche Zahlen an
          den Zweigen stehen, wenn du mit „krank“ beginnst und wenn du mit „Test positiv“ beginnst.
      - type: vue-component
        id: tafel-schnelltest
        component: Vierfeldertafel
        props:
          a: krank
          na: gesund
          b: Test positiv
          nb: Test negativ
          ka: K
          kna: G
          kb: T
          knb: N
          ab: 36
          anb: 4
          nab: 48
          nanb: 912
        nojs: |
          Die Tafel zählt 1000 Personen: 36 sind krank und haben einen positiven Test, 4 sind krank mit negativem Test, 48
          sind gesund mit positivem Test, 912 sind gesund mit negativem Test. Die Summen: 40 krank, 960 gesund, 84 positiv,
          916 negativ. Im Baum mit „krank“ zuerst gehen von den 40 Kranken 36 zu „positiv“. Mit „Test positiv“ zuerst gehen
          von den 84 Positiven 36 zu „krank“.
      - type: single-choice
        id: nenner-wahl
        text: Dein Test ist positiv. Du willst wissen, wie wahrscheinlich es ist, dass du krank bist. Durch welche Zahl teilst du?
        options:
          - text: Durch 40, die Zahl aller Kranken.
            correct: false
            info: Das wäre die Frage in die andere Richtung, wie wahrscheinlich ein positiver Test bei Kranken ist.
          - text: Durch 1000, die Zahl aller Personen.
            correct: false
            info: Das gibt die Wahrscheinlichkeit, krank und positiv zugleich zu sein. Du weißt aber schon, dass dein Test positiv ist.
          - text: Durch 84, die Zahl aller Personen mit positivem Test.
            correct: true
            info: Du weißt, dass der Test positiv ist. Darum zählen nur die Personen mit positivem Test, das sind 84.
        explanation: Die Bedingung, hier „Test positiv“, legt fest, durch welche Zahl du teilst. Nur ihre Fälle zählen als Gesamtheit.
  - type: section
    id: regel
    title: Die Bedingung bestimmt den Nenner
    blocks:
      - type: definition
        term: bedingte Wahrscheinlichkeit
        explanation: Die Wahrscheinlichkeit eines Ereignisses A, wenn du schon weißt, dass ein Ereignis B eingetreten ist. Du schreibst $P_B(A)$ und liest „P von A unter der Bedingung B“.
      - type: text
        text: In der Tafel liest du sie in der Zeile oder Spalte der Bedingung ab. Die Zahl im Feld kommt in den Zähler, die Summe der Bedingung in den Nenner.
      - type: formula
        formula: 'P_T(K) = \frac{36}{84} = \frac{3}{7} \approx 0{,}43'
      - type: formula
        formula: 'P_K(T) = \frac{36}{40} = 0{,}9'
      - type: note
        title: Merke
        blocks:
          - type: text
            text: Wenn du A und B vertauschst, ändert sich die Gesamtheit und damit der Nenner. Die zwei Wahrscheinlichkeiten sind verschieden.
  - type: section
    id: beispiel
    title: Zwei Fragen, zwei Antworten
    blocks:
      - type: example
        title: Beispiel
        blocks:
          - type: text
            text: Dieselbe Tafel gibt zwei verschiedene Antworten, je nachdem, welche Bedingung gilt.
          - type: table
            caption: Zwei Richtungen aus einer Tafel
            header: [Frage, Bedingung, Gesamtheit, Ergebnis]
            rows:
              - ["Wie wahrscheinlich ist ein positiver Test bei Kranken?", "krank", "40", "36 von 40, also 0,9"]
              - [
                  "Wie wahrscheinlich ist Krankheit bei positivem Test?",
                  "Test positiv",
                  "84",
                  "36 von 84, ungefähr 0,43",
                ]
          - type: text
            text: Der Test erkennt 9 von 10 Kranken. Trotzdem ist bei einem positiven Test weniger als die Hälfte der Personen wirklich krank, weil es viele Gesunde gibt.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: generated
        id: bedingt-tafel
        given:
          n: { oneOf: [200, 400] }
          x: { oneOf: [8, 10, 12, 14, 16] }
          p: { oneOf: [20, 25, 40, 50] }
        where: ["x < p", "x * n != p * p"]
        task:
          text: "In einer Tafel mit {{n}} Personen sind {{x}} krank und haben einen positiven Test. Insgesamt sind {{p}} Personen positiv getestet. Wie wahrscheinlich ist es, krank zu sein, wenn der Test positiv ist? Gib die Wahrscheinlichkeit als Dezimalzahl an."
        answer: { value: "x / p", compare: number }
        mistakes:
          - {
              value: "x / n",
              message: "Du hast durch alle Personen geteilt. Die Bedingung ist der positive Test, also teilst du durch die Zahl der positiv Getesteten.",
            }
          - {
              value: "p / n",
              message: "Das ist der Anteil der positiven Tests an allen Personen. Gefragt ist der Anteil der Kranken unter den Positiven.",
            }
        hint: "Welche Gruppe weißt du schon? Nur die zählt als Gesamtheit."
        steps:
          - '$P = \frac{{{x}}}{{{p}}} = {{answer}}$'
      - type: true-false
        id: richtung
        text: Wenn ein Test 9 von 10 Kranken erkennt, sind 9 von 10 Personen mit positivem Test krank.
        answer: false
        explanation: Das sind zwei verschiedene Fragen. Die 9 von 10 gelten unter den Kranken. Bei den Personen mit positivem Test gehören auch viele Gesunde dazu, darum ist der Anteil der Kranken dort kleiner.
      - type: single-choice
        id: zahlen-zuordnen
        text: Welche Rechnung gibt die Wahrscheinlichkeit, dass ein positiver Test bei einer kranken Person herauskommt?
        options:
          - text: 36 durch 84
            correct: false
            info: Das ist der Anteil der Kranken unter den Positiven, also die Frage in die andere Richtung.
          - text: 36 durch 1000
            correct: false
            info: Das ist der Anteil von Personen, die krank sind und positiv testen, an allen Personen.
          - text: 36 durch 40
            correct: true
            info: Die Bedingung ist „krank“. Von den 40 Kranken testen 36 positiv.
        explanation: Die Bedingung, nach der gefragt wird („bei Kranken“), bestimmt die Gesamtheit im Nenner.
      - type: single-choice
        id: sicherheit
        text: Dein Schnelltest ist positiv, der Test erkennt 90 % der Kranken. Was sagt das über die Wahrscheinlichkeit, krank zu sein?
        options:
          - text: Sie beträgt 90 %.
            correct: false
            info: Die 90 % gelten unter den Kranken. Du weißt aber nur, dass dein Test positiv ist.
          - text: Sie hängt davon ab, wie viele Gesunde ebenfalls positiv testen.
            correct: true
            info: Je mehr gesunde Personen ein positives Ergebnis bekommen, desto kleiner ist der Anteil der Kranken unter den Positiven.
          - text: Sie beträgt 10 %.
            correct: false
            info: Die 10 % sind der Anteil der Kranken, die der Test übersieht. Sie sagen nichts über positive Tests.
        explanation: Die Wahrscheinlichkeit, krank zu sein, wenn der Test positiv ist, rechnest du mit den Positiven als Gesamtheit. Dort zählen Kranke und Gesunde.
  - type: section
    id: abschluss
    title: Das nimmst du mit
    blocks:
      - type: note
        title: Rückblick auf das Kapitel
        blocks:
          - type: text
            text: |
              Mit der Vierfeldertafel zählst du zwei Merkmale gemeinsam. Der Baum zeigt dieselben Zahlen in zwei Richtungen. Bei
              einer bedingten Wahrscheinlichkeit legt die Bedingung fest, durch welche Summe du teilst. Wenn du die Richtung
              der Bedingung vertauschst, ändert sich das Ergebnis.
