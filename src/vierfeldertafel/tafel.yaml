# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Vierfeldertafel
description: "Zwei verknüpfte Ereignisse in einer Vierfeldertafel darstellen und Wahrscheinlichkeiten ablesen."
competencies: [vierfeldertafel]
blocks:
  - type: section
    id: warum
    title: Was du hier lernst
    blocks:
      - type: text
        text: |
          Du lernst, zwei Merkmale in einer Tafel gemeinsam zu zählen und daraus Wahrscheinlichkeiten abzulesen. Beim
          Spieleabend sind 50 Gäste. Manche spielen Karten, manche ein Brettspiel, manche beides, manche keins von beiden.
          Eine **Vierfeldertafel** zeigt alle vier Fälle auf einen Blick. Tippe in der Tafel auf eine Zelle, zum Beispiel auf die 12.
          Im Baum leuchtet das Blatt auf, das zu dieser Zelle gehört, und darunter steht der Anteil an allen 50 Gästen als Dezimalzahl. Wechsle bei „Baum lesen mit“
          zwischen Karten und Brett. Die Blätter ändern ihre Reihenfolge, die Anteile bleiben gleich.
      - type: vue-component
        id: tafel-spieleabend
        component: Vierfeldertafel
        props:
          a: Karten
          na: ohne Karten
          b: Brett
          nb: ohne Brett
          ka: K
          kna: nK
          kb: B
          knb: nB
          ab: 12
          anb: 18
          nab: 10
          nanb: 10
        nojs: |
          Die Tafel zählt 50 Gäste in vier Felder: 12 spielen Karten und Brett, 18 nur Karten, 10 nur Brett, 10 keins von
          beiden. Die Zeilensummen sind 30 (Karten) und 20 (ohne Karten), die Spaltensummen 22 (Brett) und 28 (ohne Brett).
          Im Baum mit Karten zuerst teilen sich die 50 in 30 und 20, die 30 in 12 und 18, die 20 in 10 und 10.
      - type: single-choice
        id: tafel-gesamt
        text: Wie viele Gäste spielen weder Karten noch Brett?
        options:
          - text: "20, das sind die Gäste ohne Karten."
            correct: false
            info: Von den 20 Gästen ohne Karten spielen 10 Brett. Sie zählen nicht zu denen, die gar nichts spielen.
          - text: "10, das ist das Feld „ohne Karten, ohne Brett“."
            correct: true
            info: Das Feld „ohne Karten, ohne Brett“ zählt genau die Gäste, auf die beide Angaben zugleich zutreffen, hier „nein“ und „nein“.
          - text: "28, das sind die Gäste ohne Brett."
            correct: false
            info: Von den 28 Gästen ohne Brett spielen 18 Karten. Sie zählen nicht zu denen, die gar nichts spielen.
        explanation: Für „weder noch“ brauchst du das Feld, in dem beide Merkmale fehlen.
  - type: section
    id: regel
    title: So liest du die Tafel
    blocks:
      - type: definition
        term: Vierfeldertafel
        explanation: Eine Tabelle mit vier Feldern für zwei Merkmale, die jeweils zutreffen oder nicht. Jedes Feld zählt die Fälle, auf die beide Angaben zugleich passen. Am Rand stehen die Summen.
      - type: text
        text: |
          Jede Zeile und jede Spalte hat eine **Summe** am Rand. Die Zeilensummen ergeben zusammen die Gesamtzahl, die
          Spaltensummen ebenfalls. Die Gesamtzahl steht unten rechts. Fehlt in der Tafel eine Zahl, rechnest du sie aus der Summe ihrer Zeile oder
          ihrer Spalte aus.
      - type: text
        text: "Beispiel: Karten und Brett spielen 12 von 50 Gästen. Das schreibst du so:"
      - type: formula
        formula: 'P = \frac{12}{50} = 0{,}24'
      - type: note
        title: Merke
        blocks:
          - type: text
            text: Eine Wahrscheinlichkeit aus der Tafel ist die Zahl im Feld oder in der Summe am Rand, geteilt durch die Gesamtzahl.
  - type: section
    id: beispiel
    title: Fehlende Zahlen ergänzen
    blocks:
      - type: example
        title: Beispiel
        blocks:
          - type: text
            text: |
              Bei einem Schulfest sind 80 Gäste. 45 tranken Saft, 35 aßen Kuchen, und 20 haben beides. Wie viele haben nur
              Saft getrunken?
          - type: table
            caption: Rechenweg in vier Schritten
            header: [Feld, Rechnung, Zahl]
            rows:
              - ["beides", "gegeben", "20"]
              - ["nur Saft", "45 − 20", "25"]
              - ["nur Kuchen", "35 − 20", "15"]
              - ["keins", "80 − 60", "20"]
          - type: text
            text: Die Summen der Zeilen und Spalten stimmen dann wieder mit 80 überein.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: generated
        id: nur-karten
        given:
          n: { oneOf: [40, 60, 80] }
          k: { oneOf: [20, 24, 28, 32] }
          x: { oneOf: [6, 8, 10, 14] }
        where: ["k != 2 * x", "k + x < n"]
        task:
          text: "Auf einem Spieleabend sind {{n}} Gäste. {{k}} spielen Karten, davon spielen {{x}} auch ein Brettspiel. Wie viele Gäste spielen nur Karten?"
        answer: { value: "k - x", compare: number }
        mistakes:
          - {
              value: "k",
              message: "Du hast alle Kartenspieler genommen. Die Gäste, die auch Brett spielen, zählen nicht zu denen, die nur Karten spielen.",
            }
          - { value: "x", message: "Das sind die Gäste, die beides spielen. Gefragt sind die, die nur Karten spielen." }
        hint: "Trenne die Kartenspieler in zwei Gruppen: die mit Brett und die ohne."
        steps:
          - "$k - x = {{k}} - {{x}} = {{answer}}$, also {{answer}} Gäste."
      - type: true-false
        id: summen-doppelt
        text: Die Zeilensumme von „Karten“ (30) und die Spaltensumme von „Brett“ (22) ergeben zusammen die Zahl aller Gäste (50).
        answer: false
        explanation: Wer Karten und Brett spielt, ist in beiden Summen enthalten. Er wird doppelt gezählt. Es kommt 30 + 22 = 52 heraus, das sind mehr als 50. Die Gesamtzahl ergibt sich nur aus allen Zeilen oder allen Spalten.
      - type: number
        id: tafel-ergaenzen
        text: "Von 60 Kindern einer Klassenfahrt schwimmen 36, 30 radeln, und 15 tun beides. Zeichne dir die Vierfeldertafel auf Papier und ergänze sie. Wie viele Kinder schwimmen nicht und radeln nicht?"
        material:
          - type: table
            caption: Klassenfahrt, 60 Kinder
            header: [Gruppe, Kinder]
            rows:
              - ["schwimmen", "36"]
              - ["radeln", "30"]
              - ["schwimmen und radeln", "15"]
              - ["alle Kinder", "60"]
        answer: 9
        tolerance: 0
        mistakes:
          - { answer: 24, message: "Das sind alle Kinder, die nicht schwimmen. Darunter sind auch Kinder, die radeln." }
          - {
              answer: 15,
              message: "15 steht in der Tafel (beides oder nur radeln). Gefragt ist das Feld, in dem beides fehlt.",
            }
        hint: "Bestimme zuerst, wie viele Kinder nur schwimmen. Rechne dann in der Zeile oder Spalte weiter."
        explanation: "Nur schwimmen: 36 − 15 = 21. Nur radeln: 30 − 15 = 15. Schwimmen nicht und radeln nicht: 60 − 15 − 21 − 15 = 9. Probe in der Zeile: 15 + 9 = 24."
      - type: true-false
        id: zeilen-summe
        text: Wenn du alle Zeilensummen einer Vierfeldertafel addierst, erhältst du die Zahl aller Fälle.
        answer: true
        explanation: Jeder Fall steht in genau einer Zeile. Die Zeilensummen zählen deshalb alle Fälle genau einmal. Dasselbe gilt für die Spaltensummen.
      - type: matching
        id: tafel-zuordnen
        text: "Ordne zu: Welche Zahl in der Tafel gehört zu welcher Aussage?"
        material:
          - type: table
            caption: Schulfest, 80 Gäste
            header: [Gruppe, Gäste]
            rows:
              - ["Saft und Kuchen", "20"]
              - ["Saft, kein Kuchen", "25"]
              - ["Kuchen, kein Saft", "15"]
              - ["weder Saft noch Kuchen", "20"]
        pairs:
          - { left: "Gäste mit Saft oder Kuchen oder beidem", right: "60" }
          - { left: "Gäste mit Saft, egal ob mit Kuchen", right: "45" }
          - { left: "Gäste mit Kuchen, egal ob mit Saft", right: "35" }
          - { left: alle Gäste, right: "80" }
        explanation: "Eine Summe am Rand zählt alle Felder ihrer Zeile oder Spalte zusammen, zum Beispiel Saft mit und ohne Kuchen 20 + 25 = 45. Wer Saft oder Kuchen oder beides hat, ist jeder außer den 20 ohne beides: 80 − 20 = 60."
      - type: generated
        id: tafel-wahrscheinlichkeit
        given:
          n: { oneOf: [40, 50, 100, 200] }
          x: { oneOf: [6, 8, 10, 12, 14] }
        task:
          text: "Beim Spieleabend sind {{n}} Gäste, {{x}} davon spielen Karten und Brett. Ein Gast wird zufällig ausgewählt. Mit welcher Wahrscheinlichkeit spielt er beides? Gib sie als Dezimalzahl an."
        answer: { value: "x / n", compare: number }
        mistakes:
          - {
              value: "x",
              message: "Das ist die Zahl der Gäste, keine Wahrscheinlichkeit. Teile sie durch die Gesamtzahl der Gäste.",
            }
          - {
              value: "n / x",
              message: "Du hast die Zahlen vertauscht. Die Zahl im Feld kommt in den Zähler, die Gesamtzahl in den Nenner.",
            }
        hint: "Wie viele Gäste sind es insgesamt, und wie viele davon sind günstig?"
        steps:
          - '$P = \frac{{{x}}}{{{n}}} = {{answer}}$'
