# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Zufallsversuche
description: "Zufall im Alltag erkennen und Zufallsversuche mit ihren Ergebnissen beschreiben, mit der Zufallsmaschine zum Ausprobieren."
competencies: [zufallserscheinungen]
blocks:
  - type: section
    id: warum
    title: Würfeln am Spieleabend
    blocks:
      - type: text
        text: |
          Mia und Jonas spielen ein Würfelspiel. Jonas wartet schon lange auf eine Sechs. Wirf selbst: erst ein paarmal, dann
          viele Würfe auf einmal. Schau auf die Tabelle.
      - type: vue-component
        id: maschine-wuerfel
        component: ZufallMaschine
        props:
          geraet: wuerfel
          beobachte: "6"
          zeigeWert: true
        nojs: |
          Die Zufallsmaschine wirft einen Würfel so oft, wie du willst, und zählt die Ergebnisse 1 bis 6. Ein Beispiel
          mit 60 Würfen: 1 kam 9-mal, 2 kam 11-mal, 3 kam 8-mal, 4 kam 12-mal, 5 kam 9-mal und die 6 kam 11-mal. Die
          Sechs hat also die relative Häufigkeit 11 von 60, ungefähr 0,18. Bei sehr vielen Würfen liegt sie nahe bei
          einem Sechstel, ungefähr 0,17.
      - type: single-choice
        id: zufall-erkennen
        text: Jonas hat sechsmal gewürfelt. Muss genau eine Sechs dabei sein?
        options:
          - text: Nein, es können auch keine oder mehrere Sechsen kommen.
            correct: true
            info: Jeder Wurf ist für sich Zufall. Vorher kannst du nicht sagen, welche Zahl kommt.
          - text: Ja, bei sechs Würfen kommt jede Zahl einmal.
            correct: false
            info: Das stimmt nicht. Die Würfe merken sich nichts, eine Zahl kann mehrmals kommen und eine andere nie.
          - text: Ja, die Sechs ist beim sechsten Wurf an der Reihe.
            correct: false
            info: Es gibt keine feste Reihenfolge. Beim sechsten Wurf ist jede Zahl wieder möglich.
        explanation: Beim Würfeln steht das Ergebnis erst nach dem Wurf fest. Das ist das Besondere an einem Zufallsversuch.
        links:
          - {
              title: "Zufallsversuche (Lernlandkarte)",
              url: "https://lernapps.net/apps/map/mathematik/c/zufallserscheinungen/",
            }
  - type: section
    id: regel
    title: Was ist ein Zufallsversuch?
    blocks:
      - type: definition
        term: Zufallsversuch
        explanation: Ein Versuch, dessen Ausgang du vorher nicht sicher kennst und den du unter gleichen Bedingungen wiederholen kannst. Beispiele sind Würfeln, Münzwerfen und Glücksraddrehen.
      - type: definition
        term: Ergebnis
        explanation: Das, was am Ende eines Versuchs herauskommt. Beim Würfeln ist ein Ergebnis zum Beispiel die 4, beim Glücksrad die Farbe, auf der der Zeiger stehen bleibt.
      - type: definition
        term: Ergebnismenge
        explanation: Alle möglichen Ergebnisse eines Versuchs, in geschweiften Klammern aufgeschrieben. Beim Würfel ist es die Menge aus den Zahlen von 1 bis 6.
      - type: formula
        formula: '\{1, 2, 3, 4, 5, 6\}'
  - type: section
    id: beispiel
    title: Zufall oder nicht?
    blocks:
      - type: example
        title: Beispiel
        blocks:
          - type: text
            text: Nicht alles im Alltag ist Zufall. Bei diesen Situationen kannst du prüfen, ob du das Ergebnis vorher kennst.
          - type: table
            caption: Zufallsversuche und Ergebnisse
            header: [Situation, Ergebnisse, Zufallsversuch?]
            rows:
              - ["Münze werfen", "Kopf oder Zahl", "ja"]
              - ["Glücksrad mit drei Farben drehen", "Rot, Blau oder Gelb", "ja"]
              - ["Würfel werfen", "1 bis 6", "ja"]
              - ["Einen Stein loslassen", "Er fällt nach unten.", "nein"]
              - ["3 + 4 rechnen", "7", "nein"]
      - type: vue-component
        id: maschine-reisszwecke
        component: ZufallMaschine
        props:
          geraet: reisszwecke
          beobachte: Spitze oben
        nojs: |
          Die Zufallsmaschine wirft eine Reißzwecke so oft, wie du willst. Die Ergebnisse sind „Spitze oben“ und
          „Spitze unten“. Anders als beim Würfel kannst du hier nicht vorher rechnen, wie oft eine Seite kommt: Du musst
          werfen und zählen. Ein Beispiel mit 100 Würfen: 37-mal Spitze oben und 63-mal Spitze unten.
      - type: text
        text: Bei der Reißzwecke kannst du nicht rechnen. Wirf sie 100-mal und lies ab, wie oft die Spitze oben liegt.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: generated
        id: gluecksrad-ergebnisse
        given:
          k: { int: [3, 6] }
          f: { int: [2, 4] }
        task:
          text: "Ein Glücksrad hat {{k}} Farben. Jede Farbe kommt auf {{f}} Feldern vor. Das Ergebnis ist die Farbe, auf der der Zeiger stehen bleibt. Wie viele mögliche Ergebnisse hat ein Dreh?"
        answer: { value: "k", compare: number }
        mistakes:
          - { value: "k * f", message: "Du hast die Felder gezählt. Das Ergebnis ist aber die Farbe, nicht das Feld." }
        hint: "Zähle nur die verschiedenen Farben."
        steps:
          - "Es gibt {{k}} Farben, also {{answer}} mögliche Ergebnisse."
      - type: single-choice
        id: kein-ausgleich
        text: Eine Münze fiel fünfmal hintereinander auf Zahl. Was gilt für den sechsten Wurf?
        options:
          - text: Kopf und Zahl sind wieder gleich möglich.
            correct: true
            info: Die Münze merkt sich nichts. Jeder Wurf ist ein neuer Zufallsversuch unter gleichen Bedingungen.
          - text: Kopf ist jetzt eher dran, damit es sich ausgleicht.
            correct: false
            info: Ein Ausgleich passiert nicht Wurf für Wurf. Erst bei sehr vielen Würfen gleichen sich die Anteile an.
          - text: Zahl ist wahrscheinlicher, weil sie schon oft kam.
            correct: false
            info: Auch das stimmt nicht. Frühere Würfe ändern nichts am nächsten Wurf.
        explanation: Zufallsversuche haben kein Gedächtnis. Probiere es in der Zufallsmaschine mit der Münze aus.
        links:
          - {
              title: "Zufallsversuche (Lernlandkarte)",
              url: "https://lernapps.net/apps/map/mathematik/c/zufallserscheinungen/",
            }
      - type: matching
        id: ergebnisse-zuordnen
        text: Ordne jedem Zufallsversuch seine Ergebnismenge zu.
        pairs:
          - { left: Münze werfen, right: "Kopf, Zahl" }
          - { left: Würfel werfen, right: "1, 2, 3, 4, 5, 6" }
          - { left: "Glücksrad mit Rot, Blau, Gelb", right: "Rot, Blau, Gelb" }
        distractors: ["Ja, Nein"]
        explanation: Die Ergebnismenge nennt jedes mögliche Ergebnis genau einmal.
        links:
          - {
              title: "Zufallsversuche (Lernlandkarte)",
              url: "https://lernapps.net/apps/map/mathematik/c/zufallserscheinungen/",
            }
