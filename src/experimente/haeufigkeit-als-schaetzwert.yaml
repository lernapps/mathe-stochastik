# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Relative Häufigkeit als Schätzwert
description: "Wo du nicht rechnen kannst, wirfst du oft und zählst: die relative Häufigkeit als Schätzwert, und warum sie bei vielen Versuchen verlässlicher wird."
competencies: [haeufigkeit-als-schaetzwert]
blocks:
  - type: section
    id: warum
    title: Der Steckstein am Spieleabend
    blocks:
      - type: text
        text: |
          Mia, Jonas und Lena spielen am Spieleabend. Beim Würfel wissen sie: Auf lange Sicht kommt jede Zahl
          in etwa einem von sechs Würfen vor, bei der Münze kommt Kopf in etwa einem von zwei Würfen vor. Heute hat Lena einen
          Steckstein mitgebracht. Er wird geworfen wie ein Würfel und kann mit den Noppen nach oben, mit den Noppen nach
          unten oder auf der Seite landen. Wie oft was kommt, weiß niemand.
      - type: single-choice
        id: stein-herausfinden
        text: Lena möchte wissen, wie oft der Stein mit den Noppen nach oben liegt. Was können die drei tun?
        options:
          - text: Den Stein einmal werfen und das Ergebnis merken.
            correct: false
            info: Ein einzelner Wurf ist Zufall. Er sagt kaum etwas darüber, wie oft die Noppen oben liegen.
          - text: Den Stein 5-mal werfen und das Ergebnis als sicher festhalten.
            correct: false
            info: Fünf Würfe sind noch Zufall. Mit zehn weiteren Würfen kann sich das Bild deutlich ändern.
          - text: Den Stein sehr oft werfen und zählen, in welchem Anteil der Würfe die Noppen oben liegen.
            correct: true
            info: So gewinnt man eine Zahl aus vielen Würfen. Das ist der Weg, wenn man nicht ausrechnen kann, was herauskommt.
          - text: Darüber nachdenken, denn beim Würfel geht das ja auch, also geht es hier genauso.
            correct: false
            info: Der Würfel ist ganz gleichmäßig gebaut. Der Steckstein ist es nicht, darum gibt es keinen Grund für eine bestimmte Zahl.
        explanation: Wenn du nicht ausrechnen kannst, wie oft etwas vorkommt, hilft nur, oft zu werfen und zu zählen.
  - type: section
    id: regel
    title: Zählen und den Anteil bilden
    blocks:
      - type: text
        text: |
          Die drei werfen den Stein 20-mal und zählen. Die Noppen liegen 9-mal oben. Das ist die **absolute Häufigkeit**:
          eine Anzahl, die sagt, wie oft ein Ergebnis vorkam. Die **relative Häufigkeit** ist der Anteil an allen Würfen.
          Du teilst die absolute Häufigkeit durch die Zahl aller Würfe und gibst das als Bruch, als Dezimalzahl oder in
          Prozent an.
      - type: formula
        formula: 'h = \frac{\text{absolute Häufigkeit}}{\text{Zahl aller Würfe}}'
      - type: formula
        formula: '\frac{9}{20} = 0{,}45 = 45\,\%'
      - type: definition
        term: Schätzwert
        explanation: Eine Zahl, die du aus Versuchen gewinnst und als Näherung dafür nimmst, wie oft etwas auf lange Sicht vorkommt. Die relative Häufigkeit aus deinen Würfen ist so ein Schätzwert. Er ist nicht der genaue Wert.
      - type: definition
        term: Schwankung
        explanation: Wie stark die relative Häufigkeit von Reihe zu Reihe abweicht. Wirfst du zweimal je 10-mal, können ganz verschiedene Zahlen herauskommen.
      - type: note
        title: Merke
        blocks:
          - type: text
            text: Je mehr Würfe, desto kleiner die Schwankung und desto verlässlicher der Schätzwert. Sicher ist er nie, auch nach sehr vielen Würfen nicht.
  - type: section
    id: beispiel
    title: Reißzwecke und Steckstein
    blocks:
      - type: example
        title: Beispiel
        blocks:
          - type: text
            text: Jonas wirft eine Reißzwecke 40-mal. Er zählt und rechnet die relative Häufigkeit aus.
          - type: table
            caption: 40 Würfe mit der Reißzwecke, relativ = absolut geteilt durch 40
            header: [Ergebnis, absolut, relativ]
            rows:
              - ["Spitze oben", "15", "0,375 = 37,5 %"]
              - ["Spitze unten", "25", "0,625 = 62,5 %"]
              - ["alle Würfe", "40", "1 = 100 %"]
          - type: text
            text: "Die beiden relativen Häufigkeiten ergeben zusammen 1, denn jeder Wurf hat genau ein Ergebnis. Fehlt dir ein Ergebnis in einer Aufgabe, ist es der Rest: alle Würfe minus die anderen Ergebnisse. Für Prozent rechnest du die Dezimalzahl mal 100. Jonas nimmt 0,375 als Schätzwert dafür, wie oft die Spitze auf lange Sicht oben liegt."
      - type: text
        text: |
          Jetzt zurück zum Steckstein. Die Zufallsmaschine wirft ihn für dich. Mit jedem Knopf wirft sie mehrmals und zählt
          in der Tabelle mit. Die Zeile „Noppen oben“ ist mit ◄ markiert. So gehst du vor: Drücke einmal „10 Würfe“ und
          lies in dieser Zeile die relative Häufigkeit ab. Drücke „Zurücksetzen“ und mache es noch einmal. Das sind zwei
          Reihen mit je 10 Würfen. Mach dann zwei Reihen mit je 1000 Würfen (zehnmal „100 Würfe“ oder einmal „1000 Würfe“).
          Vergleiche, welche beiden Zahlen näher beieinander liegen. Die Linie unter der Tabelle zeigt dir dasselbe: Sie
          wackelt am Anfang stark und wird ruhiger.
      - type: vue-component
        id: maschine-legostein
        component: ZufallMaschine
        props:
          geraet: legostein
          beobachte: Noppen oben
        nojs: |
          Die Zufallsmaschine wirft einen Steckstein so oft, wie du willst. Die Ergebnisse sind „Noppen oben“, „Noppen
          unten“ und „Auf der Seite“. Ein Beispiel mit vier Reihen: Bei zwei Reihen mit je 10 Würfen lagen die Noppen 5-mal
          und 4-mal oben, die relativen Häufigkeiten sind 0,5 und 0,4. Bei zwei Reihen mit je 1000 Würfen lagen die Noppen
          458-mal und 467-mal oben, die relativen Häufigkeiten sind 0,458 und 0,467.
      - type: single-choice
        id: reihen-vergleichen
        text: Du hast zwei Reihen mit je 10 Würfen und zwei Reihen mit je 1000 Würfen gemacht. Was fällt bei den relativen Häufigkeiten von „Noppen oben“ auf?
        options:
          - text: Bei 10 Würfen liegen die beiden Zahlen näher beieinander als bei 1000 Würfen.
            correct: false
            info: Es ist umgekehrt. Bei wenigen Würfen kann ein einzelner Wurf die Zahl stark ändern.
          - text: In beiden Fällen kommt jedes Mal genau dieselbe Zahl heraus.
            correct: false
            info: Das stimmt nicht. Auch bei 1000 Würfen unterscheiden sich zwei Reihen noch ein wenig, nur weniger als bei 10 Würfen.
          - text: Bei 1000 Würfen liegen die beiden Zahlen näher beieinander als bei 10 Würfen.
            correct: true
            info: Bei vielen Würfen fällt ein einzelner Wurf kaum noch ins Gewicht. Die Schwankung ist kleiner.
        explanation: Je mehr Würfe, desto kleiner die Schwankung von Reihe zu Reihe. Darum ist der Schätzwert aus 1000 Würfen verlässlicher als der aus 10 Würfen.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: true-false
        id: genauer-wert
        text: Lena hat einen Steckstein aus ihrer Kiste 1000-mal geworfen. Die relative Häufigkeit von „Noppen oben“ ist 0,571. Lena sagt, jetzt sei 0,571 der genaue Wert für den Stein und weitere Würfe seien nicht nötig. Stimmt das?
        answer: false
        explanation: Die relative Häufigkeit ist nur ein Schätzwert. Eine neue Reihe mit 1000 Würfen würde etwas anderes liefern, zum Beispiel 0,58, bei einem anderen Stein ebenso eine andere Zahl. Mit vielen Würfen ist der Schätzwert verlässlich, aber nie genau.
      - type: matching
        id: begriffe-zuordnen
        text: Ordne jeder Angabe zu, was sie ist.
        pairs:
          - { left: "Die Reißzwecke fiel 9-mal mit der Spitze nach oben.", right: absolute Häufigkeit }
          - { left: "9 von 30 Würfen, also 0,3", right: relative Häufigkeit }
          - { left: "Wir nehmen 0,3 als Zahl dafür, wie oft die Spitze auf lange Sicht oben liegt.", right: Schätzwert }
        explanation: Die absolute Häufigkeit zählt, wie oft etwas vorkam. Die relative Häufigkeit setzt das ins Verhältnis zu allen Würfen. Wenn du sie als Näherung für lange Sicht nimmst, ist sie ein Schätzwert.
      - type: single-choice
        id: im-verhaeltnis
        text: Jonas hat den Steckstein 20-mal geworfen, die Noppen lagen 12-mal oben. Lena hat ihn 50-mal geworfen, bei ihr lagen die Noppen 25-mal oben. Bei wem kam „Noppen oben“ im Verhältnis zu allen Würfen häufiger vor?
        options:
          - text: Bei Jonas, denn 12 von 20 sind 0,6 und 25 von 50 sind nur 0,5.
            correct: true
            info: Erst der Anteil an allen Würfen macht beide Reihen vergleichbar, auch wenn Jonas weniger geworfen hat.
          - text: Bei Lena, denn 25 ist mehr als 12.
            correct: false
            info: Du hast die absoluten Häufigkeiten verglichen. Lena hat aber mehr als doppelt so oft geworfen, darum sind ihre 25 nicht mehr wert.
          - text: Bei beiden gleich oft, denn beide haben die Noppen oft oben gesehen.
            correct: false
            info: Das lässt sich nachrechnen. Bei Lena war es genau die Hälfte der Würfe, bei Jonas mehr als die Hälfte.
        explanation: Reihen mit verschieden vielen Würfen vergleichst du mit der relativen Häufigkeit, nicht mit der absoluten.
      - type: single-choice
        id: zu-wenige-wuerfe
        text: Mia wirft die Reißzwecke fünfmal, die Spitze liegt 4-mal oben. Mia sagt, damit stehe fest, dass die Spitze bei 80 % der Würfe oben liegt. Was antwortest du?
        options:
          - text: Du hast recht, 4 von 5 sind 0,8, und das gilt jetzt für alle weiteren Würfe.
            correct: false
            info: Nach nur 5 Würfen kann sich die Zahl mit jedem weiteren Wurf noch stark ändern. Festlegen darfst du dich so früh nicht.
          - text: Das hängt von der absoluten Häufigkeit ab, nimm lieber die 4 als Schätzwert.
            correct: false
            info: Die 4 sagt allein nichts über den Anteil. Der Schätzwert ist die relative Häufigkeit, nicht die absolute.
          - text: Fünf Würfe sind zu wenig, wirf viel öfter, dann ist der Schätzwert verlässlicher.
            correct: true
            info: Mit mehr Würfen schwankt die relative Häufigkeit weniger. Ganz sicher wird sie aber auch dann nicht.
        explanation: Nach wenigen Würfen kann die relative Häufigkeit noch weit vom Wert auf lange Sicht entfernt sein. Erst viele Würfe machen den Schätzwert verlässlich.
      - type: number
        id: wie-oft-oben
        text: Mia hat die Reißzwecke 200-mal geworfen. Die relative Häufigkeit von „Spitze oben“ ist 0,36. Wie oft lag die Spitze oben?
        answer: 72
        tolerance: 0
        mistakes:
          - { answer: 128, message: "Das ist die Zahl der Würfe mit „Spitze unten“. Gefragt ist „Spitze oben“." }
          - {
              answer: 36,
              message: "Das ist die Prozentzahl, keine Anzahl von Würfen. Bei 200 Würfen ist eine Anzahl gesucht.",
            }
        hint: Die relative Häufigkeit entsteht, indem du die absolute durch 200 teilst. Wie kommst du zurück?
        explanation: Die relative Häufigkeit ist die absolute geteilt durch die Zahl aller Würfe. Umgekehrt ergibt 0,36 von 200 Würfen 72 Würfe.
      - type: generated
        id: legostein-dezimal
        given:
          n: { oneOf: [200, 250, 500] }
          a: { int: [80, 140] }
          b: { int: [50, 120] }
        where: ["a + b <= n - 20", "a != b"]
        task:
          text: "Lena wirft einen Steckstein aus ihrer Kiste {{n}}-mal. Die Noppen liegen {{a}}-mal oben, {{b}}-mal unten, und den Rest fällt er auf die Seite. Wie groß ist die relative Häufigkeit von „Noppen oben“? Gib sie als Dezimalzahl an."
        answer: { value: "a / n", compare: { number: { format: decimal, decimals: 3 } } }
        mistakes:
          - { value: "a", message: "Das ist die absolute Häufigkeit: wie oft. Gefragt ist der Anteil an allen Würfen." }
          - { value: "a * 100 / n", message: "Das ist die Prozentzahl. Gefragt ist die Dezimalzahl." }
          - {
              value: "a / (a + b)",
              message: "Auch die Würfe auf die Seite zählen zu allen Würfen. Du hast sie nicht mitgezählt.",
            }
          - {
              value: "b / n",
              message: "Das ist die relative Häufigkeit von „Noppen unten“. Gefragt ist „Noppen oben“.",
            }
        hint: "Teile die absolute Häufigkeit durch die Zahl aller Würfe. Wie viele Würfe waren es insgesamt?"
        steps:
          - '$h = \frac{\text{absolute Häufigkeit}}{\text{Zahl aller Würfe}}$'
          - '$h = \frac{{{a}}}{{{n}}} = {{answer}}$'
      - type: generated
        id: legostein-prozent
        given:
          n: { oneOf: [200, 250, 500] }
          a: { int: [80, 140] }
          b: { int: [50, 120] }
        where:
          - "a + b <= n - 20"
          - "a + b != n / 2"
          - "decimals((n - a - b) * 100 / n) <= 1"
        task:
          text: "Lena wirft einen Steckstein aus ihrer Kiste {{n}}-mal. Die Noppen liegen {{a}}-mal oben, {{b}}-mal unten, und den Rest fällt er auf die Seite. Wie viel Prozent der Würfe sind „Auf der Seite“?"
        answer: { value: "(n - a - b) * 100 / n", compare: { number: { format: percent, decimals: 1 } } }
        mistakes:
          - {
              value: "n - a - b",
              message: "Das ist die absolute Häufigkeit: wie oft der Stein auf der Seite lag. Gefragt ist der Anteil in Prozent.",
            }
          - {
              value: "(a + b) * 100 / n",
              message: "Das ist der Anteil von „Noppen oben“ und „Noppen unten“ zusammen. Gesucht ist der Rest.",
            }
          - { value: "(n - a - b) / n", message: "Das ist die Dezimalzahl. Gefragt ist die Angabe in Prozent." }
        hint: "Wie oft lag der Stein auf der Seite? Das ist, was von allen Würfen übrig bleibt."
        steps:
          - "Die Würfe „Auf der Seite“ sind der Rest: alle {{n}} Würfe ohne die {{a}} und die {{b}} Würfe der anderen Ergebnisse."
          - '$h = \frac{{{n}} - {{a}} - {{b}}}{{{n}}} \cdot 100\,\% = {{answer}}$'
          - "Probe: Die drei relativen Häufigkeiten ergeben zusammen 100 %."
  - type: section
    id: abschluss
    title: Das hast du gelernt
    blocks:
      - type: note
        title: Zusammenfassung
        blocks:
          - type: text
            text: |
              - Wo du nicht rechnen kannst, wirfst du oft und zählst.
              - Die relative Häufigkeit ist die absolute Häufigkeit geteilt durch die Zahl aller Würfe.
              - Sie ist ein Schätzwert: Je mehr Würfe, desto kleiner die Schwankung und desto verlässlicher die Zahl, aber sicher ist sie nie.
      - type: text
        text: Auf der nächsten Seite geht es um den Begriff Wahrscheinlichkeit.
